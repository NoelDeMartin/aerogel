name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version-file: '.node-version'
                  cache: true
            - run: vp run build
            - uses: actions/cache/save@v6
              with:
                  key: build-${{ github.sha }}
                  path: |
                      packages/*/dist/**

    check:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v7
            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version-file: '.node-version'
                  cache: true
            - uses: actions/cache/restore@v6
              with:
                  key: build-${{ github.sha }}
                  path: |
                      packages/*/dist/**
            - run: vp check
            - run: vp run type-check

    tests:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v7
            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version-file: '.node-version'
                  cache: true
            - uses: actions/cache/restore@v6
              with:
                  key: build-${{ github.sha }}
                  path: |
                      packages/*/dist/**
            - run: vp test --reporter verbose

    e2e:
        runs-on: ubuntu-latest
        needs: build
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
        steps:
            - uses: actions/checkout@v7
            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version-file: '.node-version'
                  cache: true
            - uses: actions/cache/restore@v6
              with:
                  key: build-${{ github.sha }}
                  path: |
                      packages/*/dist/**
            - run: vp exec playwright install --with-deps ${{ matrix.browser }}
            - run: vp run e2e:test:${{ matrix.browser }}
              working-directory: playground
            - name: Upload Playwright report
              uses: actions/upload-artifact@v7
              if: ${{ failure() }}
              with:
                  name: playwright-report-${{ matrix.browser }}
                  path: playground/playwright-report

    verify:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v7
            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version-file: '.node-version'
                  cache: true
            - uses: actions/cache/restore@v6
              with:
                  key: build-${{ github.sha }}
                  path: |
                      packages/*/dist/**
            - run: vp run verify

    publish:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        needs: [check, tests, e2e, verify]
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: voidzero-dev/setup-vp@v1.21.1
              with:
                  node-version-file: '.node-version'
                  cache: true
            - uses: actions/cache/restore@v6
              with:
                  key: build-${{ github.sha }}
                  path: |
                      packages/*/dist/**
            - run: vp exec noeldemartin-publish-modified-packages
